*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:17px/1.5 -apple-system,"SF Pro Text",system-ui,sans-serif}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 16px}
.bar{max-width:34rem;margin:0 auto;display:flex;justify-content:space-between;align-items:baseline}
h1{font-size:1.1rem;margin:0}
#sc{font-weight:700;font-variant-numeric:tabular-nums}
main{max-width:34rem;margin:0 auto;padding:14px 14px 48px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:0 0 16px}
.qh{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.qn{color:var(--mut);font-size:.9rem;font-weight:600}
.info{width:36px;height:36px;border-radius:50%;border:2px solid var(--acc);background:transparent;color:var(--acc);font:italic 700 1.1rem Georgia,serif;cursor:pointer}
.info.on{background:var(--acc);color:var(--card)}
.card img{display:block;width:100%;height:auto;background:#fff;border-radius:8px;padding:6px;margin:0 0 10px}
.qt{font-weight:600;margin:0 0 10px}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:12px;align-items:center;width:100%;min-height:52px;padding:10px 14px;text-align:left;font:inherit;color:var(--fg);background:var(--bg);border:2px solid var(--line);border-radius:12px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.opt b{flex:none;width:26px;height:26px;border-radius:50%;border:1.5px solid currentColor;display:grid;place-items:center;font-size:.85rem}
.opt span{flex:1}
.opt:disabled{opacity:.5;cursor:default}
.opt.ok,.opt.bad{opacity:1;color:#fff}
.opt.ok{background:var(--ok);border-color:var(--ok)}
.opt.bad{background:var(--bad);border-color:var(--bad)}
.opt.ok::after{content:"✓";font-weight:700}
.opt.bad::after{content:"✕";font-weight:700}
.ex{margin-top:12px;padding:12px 14px;background:var(--code);border-left:4px solid var(--acc);border-radius:0 8px 8px 0;font-size:.97rem}
.ex[hidden],#end[hidden]{display:none}
#end{text-align:center;padding:16px}
#end button{margin-top:10px;font:inherit;font-weight:600;padding:12px 22px;border-radius:12px;border:0;background:var(--acc);color:var(--card);cursor:pointer}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}

const Q=[
{img:'q1',q:'In the circuit shown, the total resistance is 24 ohms. What is the value of R2?',o:['16','40','60','64'],a:2,e:'Резисторы соединены параллельно: 1/Rt = 1/R1 + 1/R2. Отсюда 1/R2 = 1/24 − 1/40 = 5/120 − 3/120 = 2/120 = 1/60, значит R2 = 60 Ω.'},
{img:'q23',q:'What is the source voltage in the circuit shown?',o:['40','50','100','500'],a:0,e:'Общий ток 10 A, через R3 идёт 5 A, поэтому через R1 и R2 вместе идёт 10 − 5 = 5 A. Напряжение на параллельных ветвях одинаковое: E/10 + E/40 = 5, то есть E × 5/40 = 5, откуда E = 40 V. Проверка: 4 A + 1 A + 5 A = 10 A.'},
{img:'q23',q:'What is the value of R3?',o:['8','10','20','100'],a:0,e:'Напряжение на каждой параллельной ветви равно напряжению источника, 40 V (из предыдущего вопроса). Через R3 идёт 5 A, поэтому R3 = E / I = 40 / 5 = 8 Ω.'},
{img:'q4',q:'If all 4 resistors in the circuit are equal, what is the value of R3?',o:['5','20','60','80'],a:3,e:'Rt = E / I = 100 / 5 = 20 Ω. Для n одинаковых резисторов в параллели Rt = R / n, поэтому R = 4 × 20 = 80 Ω. Проверка: через каждый резистор идёт 100 / 80 = 1.25 A, а 4 × 1.25 = 5 A.'},
{img:'q5',q:'What is the source voltage in the circuit on the left?',o:['20','40','120','160'],a:1,e:'В параллельной цепи токи складываются: It = I1 + I2, значит I2 = 8 − 6 = 2 A. Напряжение источника равно напряжению на R2: E = I2 × R2 = 2 × 20 = 40 V.'},
{img:'q6',q:'The correct voltage equation for the circuit is',o:['E1 − E2 − E3 − E4 = ET','ET = E1 − E2 + E3 + E4','ET = E1 + E2 + E3 + E4','ET − E1 − E2 − E3 − E4 = 15'],a:2,e:'Цепь последовательная, поэтому сумма падений напряжения равна приложенному напряжению: ET = E1 + E2 + E3 + E4. Проверка: Rt = 2 + 3 + 7 + 3 = 15 Ω, I = 60 / 15 = 4 A, падения 8 + 12 + 28 + 12 = 60 V. В варианте D разность должна быть равна 0, а не 15.'},
{img:'q78',q:'In the circuit, what is the value of It in amperes?',o:['1.14','0.4','0.667','1.0'],a:3,e:'Правая ветвь R4 + R5 + R6 = 1 + 3 + 6 = 10 Ω. Она параллельна R2 = 10 Ω: (10 × 10) / (10 + 10) = 5 Ω. Вместе с последовательными R1 и R3: Rt = 2 + 5 + 3 = 10 Ω. It = E / Rt = 10 / 10 = 1.0 A.'},
{img:'q78',q:'In the circuit, how much power is consumed by the 6-ohm resistor?',o:['15 watts','1.5 watts','2.8 watts','3.0 watts'],a:1,e:'Общий ток 1 A делится поровну между двумя ветвями по 10 Ω, поэтому через R6 идёт 0.5 A. P = I² × R = 0.5² × 6 = 1.5 W.'}
];
let st;
const list=document.getElementById('list'),sc=document.getElementById('sc'),end=document.getElementById('end');
function upd(){
 const n=st.filter(s=>s.first===true).length;
 sc.textContent=n+' / '+Q.length;
 const all=st.every(s=>s.done);
 end.hidden=!all;
 if(all)document.getElementById('endtxt').textContent='Done! First-try score: '+n+' of '+Q.length+'.';
}
function render(){
 st=Q.map(()=>({done:false,first:null}));
 list.innerHTML='';
 Q.forEach((q,i)=>{
  const c=document.createElement('section');c.className='card';
  c.innerHTML='<div class="qh"><span class="qn">Question '+(i+1)+' of '+Q.length+'</span><button class="info" aria-expanded="false" aria-controls="ex'+i+'" aria-label="Show explanation">i</button></div><img src="'+IMG[q.img]+'" alt="Circuit diagram for question '+(i+1)+'"><p class="qt">'+q.q+'</p><div class="opts"></div><div class="ex" id="ex'+i+'" hidden>'+q.e+'</div>';
  const ex=c.querySelector('.ex'),ib=c.querySelector('.info'),box=c.querySelector('.opts');
  ib.onclick=()=>{ex.hidden=!ex.hidden;ib.setAttribute('aria-expanded',String(!ex.hidden));ib.classList.toggle('on',!ex.hidden)};
  q.o.forEach((t,j)=>{
   const b=document.createElement('button');b.className='opt';
   b.innerHTML='<b>'+'ABCD'[j]+'</b><span>'+t+'</span>';
   b.onclick=()=>{
    const s=st[i];if(s.done)return;
    if(j===q.a){b.classList.add('ok');s.done=true;if(s.first===null)s.first=true;box.querySelectorAll('.opt').forEach(x=>{if(x!==b)x.disabled=true})}
    else{b.classList.add('bad');b.disabled=true;if(s.first===null)s.first=false}
    upd();
   };
   box.appendChild(b);
  });
  list.appendChild(c);
 });
 upd();
}
document.getElementById('again').onclick=()=>{render();window.scrollTo(0,0)};
render();
</script></body></html>
