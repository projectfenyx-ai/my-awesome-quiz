let current = 0;
let score = 0;
const body = document.getElementById('quiz-body');
const progressInner = document.getElementById('progress-bar-inner');

function renderQuestion() {
  if (current >= questions.length) {
    showSummary();
    return;
  }
  progressInner.style.width = (current / questions.length * 100) + '%';
  const item = questions[current];
  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `
    <div class="qnum">Вопрос ${current + 1} из ${questions.length}</div>
    <div class="qtext">${item.q}</div>
    <div class="opts"></div>
    <div class="explain"></div>
  `;
  body.innerHTML = '';
  body.appendChild(card);
  const optsDiv = card.querySelector('.opts');
  const explainDiv = card.querySelector('.explain');

  item.opts.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.className = 'opt';
    btn.textContent = opt;
    btn.onclick = () => {
      const allBtns = optsDiv.querySelectorAll('.opt');
      allBtns.forEach(b => b.classList.add('disabled'));
      if (i === item.correct) {
        btn.classList.add('correct');
        score++;
      } else {
        btn.classList.add('wrong');
        allBtns[item.correct].classList.add('correct');
      }
      explainDiv.innerHTML = item.explain;
      explainDiv.style.display = 'block';
      const nextBtn = document.createElement('button');
      nextBtn.className = 'action';
      nextBtn.textContent = current === questions.length - 1 ? 'Завершить' : 'Следующий вопрос →';
      nextBtn.onclick = () => { current++; renderQuestion(); };
      card.appendChild(nextBtn);
    };
    optsDiv.appendChild(btn);
  });
}

function showSummary() {
  progressInner.style.width = '100%';
  body.style.display = 'none';
  const summary = document.getElementById('summary');
  summary.style.display = 'block';
  const pct = Math.round(score / questions.length * 100);
  document.getElementById('score').textContent = score + ' / ' + questions.length;
  let msg = '';
  if (pct === 100) msg = 'Отлично! Все правила усвоены.';
  else if (pct >= 80) msg = 'Хороший результат — стоит повторить пропущенные пункты.';
  else if (pct >= 50) msg = 'Есть пробелы — рекомендуется перечитать правила 3.71–3.82.';
  else msg = 'Нужно повторить материал более внимательно.';
  document.getElementById('score-text').textContent = pct + '% правильных ответов. ' + msg;
}

function restart() {
  current = 0;
  score = 0;
  document.getElementById('summary').style.display = 'none';
  body.style.display = 'block';
  renderQuestion();
}

renderQuestion();
</script>
</body>
</html>
